<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestionnaire de tâches</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { max-width: 720px; margin: 2rem auto; padding: 1rem; background: #f5f5f5; }
        h1 { color: #333; }
        .card { background: white; padding: 1.5rem; border-radius: 8px;
                box-shadow: 0 2px 6px rgba(0,0,0,.1); margin-bottom: 1rem; }
        .form-row { margin-bottom: .8rem; }
        label { display: block; font-size: .9rem; color: #555; margin-bottom: .3rem; }
        input, textarea { width: 100%; padding: .5rem; border: 1px solid #ccc;
                          border-radius: 4px; font-size: 1rem; }
        button { padding: .6rem 1.2rem; border: none; border-radius: 4px;
                 cursor: pointer; font-size: .95rem; }
        .primary { background: #2563eb; color: white; }
        .primary:hover { background: #1d4ed8; }
        .danger { background: #dc2626; color: white; }
        .task { display: flex; justify-content: space-between; align-items: start;
                gap: 1rem; padding: .8rem; border-bottom: 1px solid #eee; }
        .task:last-child { border-bottom: none; }
        .task.done .title { text-decoration: line-through; color: #888; }
        .meta { font-size: .8rem; color: #888; }
        .actions { display: flex; gap: .4rem; }
        .empty { color: #888; text-align: center; padding: 1rem; }
    </style>
</head>
<body>
    <h1>📝 Gestionnaire de tâches</h1>

    <div class="card">
        <h2>Nouvelle tâche</h2>
        <form id="task-form">
            <div class="form-row">
                <label for="title">Titre *</label>
                <input id="title" required maxlength="255">
            </div>
            <div class="form-row">
                <label for="description">Description</label>
                <textarea id="description" rows="2"></textarea>
            </div>
            <div class="form-row">
                <label for="duration">Durée (minutes)</label>
                <input id="duration" type="number" min="0" value="0">
            </div>
            <button class="primary" type="submit">Ajouter la tâche</button>
        </form>
    </div>

    <div class="card">
        <h2>Mes tâches</h2>
        <div id="task-list"><p class="empty">Chargement...</p></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
