apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: mp2-ghazi
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: taskapp
            tier: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: db-sa
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  FILENAME="/backup/dump-$(date +%Y%m%d-%H%M%S).sql"
                  echo "Sauvegarde vers $FILENAME"
                  pg_dump -h db -U "$POSTGRES_USER" "$POSTGRES_DB" > "$FILENAME"
                  echo "OK : $(ls -lh $FILENAME)"
                  ls -t /backup/dump-*.sql | tail -n +6 | xargs -r rm -v
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: app-config
                      key: DB_NAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-pvc