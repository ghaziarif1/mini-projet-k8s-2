apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-viewer
  namespace: mp2-ghazi
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-viewer-binding
  namespace: mp2-ghazi
subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: mp2-ghazi
roleRef:
  kind: Role
  name: pod-viewer
  apiGroup: rbac.authorization.k8s.io